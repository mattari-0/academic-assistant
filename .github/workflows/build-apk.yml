name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Flutter Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Binaries
        run: |
          cd mobile
          rm -rf android
          flutter create --org com.encg --project-name academic_assistant --platforms android .

      - name: Configure Android SDK & Plugin Versions
        run: |
          python3 - << 'PYEOF'
          import os, re

          android_dir = "mobile/android"

          # 1. Update root build.gradle to enforce compileSdkVersion 34 on all subprojects
          root_build = os.path.join(android_dir, "build.gradle")
          if os.path.exists(root_build):
              with open(root_build, "r", encoding="utf-8") as f:
                  content = f.read()
              subproject_config = """
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 34
            }
        }
    }
}
"""
              if "afterEvaluate" not in content:
                  content += "\n" + subproject_config
              with open(root_build, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Updated root build.gradle with subprojects compileSdkVersion")

          # 2. Patch settings.gradle
          settings_path = os.path.join(android_dir, "settings.gradle")
          if os.path.exists(settings_path):
              with open(settings_path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "com.google.gms.google-services" not in content:
                  content = re.sub(
                      r'(id\s+"dev\.flutter\.flutter-plugin-loader"[^\n]*)',
                      r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                      content
                  )
                  with open(settings_path, "w", encoding="utf-8") as f:
                      f.write(content)

          # 3. Patch app/build.gradle
          app_build = os.path.join(android_dir, "app", "build.gradle")
          if os.path.exists(app_build):
              with open(app_build, "r", encoding="utf-8") as f:
                  content = f.read()
              if "com.google.gms.google-services" not in content:
                  content = content.replace(
                      'id "dev.flutter.flutter-gradle-plugin"',
                      'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"'
                  )
              content = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', content)
              content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 34', content)
              if "multiDexEnabled" not in content:
                  content = re.sub(
                      r'(applicationId\s+["\'][^"\']+["\'])',
                      r'\1\n        multiDexEnabled true',
                      content
                  )
              with open(app_build, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Configured app/build.gradle")
          PYEOF

      - name: Restore Firebase Configuration File
        run: |
          mkdir -p mobile/android/app
          cat << 'JSON' > mobile/android/app/google-services.json
          {
            "project_info": {
              "project_number": "211249309472",
              "project_id": "academic-assistant-2db16",
              "storage_bucket": "academic-assistant-2db16.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:211249309472:android:bccf9e92f2bfb6d90ad945",
                  "android_client_info": {
                    "package_name": "com.encg.academic_assistant"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDxL0swlaxChOM0fw4KlKvY2LtcZqumiXU"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Compile Debug APK
        run: |
          cd mobile
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
